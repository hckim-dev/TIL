# Actions의 Python 버전과 일치시킵니다.
target-version = "py312"
required-version = ">=0.16.8"
line-length = 88

# Notion에서 생성된 Markdown과 첨부파일은 검사/포맷하지 않습니다.
include = ["*.py", "*.pyi", "*.ipynb"]
extend-exclude = ["TIL/**"]
force-exclude = true

[lint]
# 기본 규칙을 유지하고 import 정리, 현대 문법, 오류 가능성 검사를 추가합니다.
extend-select = ["I", "UP", "B", "SIM", "PIE", "BLE", "PYI"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
