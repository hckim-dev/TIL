name: Test Notion TIL Sync

on:
  push:
    paths:
      - "update_readme.py"
      - "til_sync/**"
      - "tests/**"
      - "requirements.txt"
      - ".python-version"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "update_readme.py"
      - "til_sync/**"
      - "tests/**"
      - "requirements.txt"
      - ".python-version"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-til-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v6

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 📥 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 🧪 변환 및 동기화 테스트
        run: python -m unittest discover -s tests -v
