name: Manual Sync & Init

on:
  workflow_dispatch:
    inputs:
      reset_readme:
        description: "⚠️ README 파일을 초기화하고 다시 만들까요? (체크 시 기존 내용 삭제됨)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notion-til-sync-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 📥 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 🧪 변환 및 동기화 테스트
        run: python -m unittest discover -s tests -v

      - name: 🚀 노션 동기화 스크립트 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          FETCH_MODE: "ALL"
          RESET_MODE: ${{ inputs.reset_readme }}
        run: python update_readme.py

      - name: 💾 변경사항 커밋 및 푸시
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USER_NAME || 'GitHub Action' }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_USER_EMAIL || 'action@github.com' }}
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -- README.md
          if [ -d TIL ]; then
            git add -- TIL
          fi
          if git diff --cached --quiet; then
            echo "동기화할 변경사항이 없습니다."
            exit 0
          fi
          git commit -m "docs: 🔄 수동 동기화 및 마크다운 업데이트"
          git fetch origin "$SYNC_BRANCH"
          git rebase "origin/$SYNC_BRANCH"
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
